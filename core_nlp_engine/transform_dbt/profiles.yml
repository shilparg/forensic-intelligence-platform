forensic_profile:  # <--- This must match the 'profile' in dbt_project.yml
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_FINAL_DATASET', 'forensic_data') }}"
      threads: 4
      keyfile: "../../{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      location: asia-southeast1
      use_storage_api: true  # Add this line